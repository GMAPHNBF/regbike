<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --hnb:#004a99;--g1:rgba(22,118,170,0.95);--g2:rgba(10,84,128,0.90);--tx:#14213d;--mut:#5d6b82}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background-color:#fff;
  background-image:
    radial-gradient(520px 360px at 12% 12%,rgba(37,170,225,0.22),transparent 70%),
    radial-gradient(560px 380px at 88% 20%,rgba(127,182,63,0.20),transparent 70%),
    radial-gradient(620px 420px at 50% 100%,rgba(37,170,225,0.16),transparent 70%);
  background-attachment:fixed}

/* ---------- shared glass ---------- */
.glass,.opt,.back,.reset,.tag,.st,.y,.hbadge{
  position:relative;isolation:isolate;overflow:hidden}
.glass::before,.opt::before,.back::before,.reset::before,.hbadge::before,.st.on::before,.st.done::before,.y.cur::before{
  content:"";position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(180deg,rgba(255,255,255,0.32),rgba(255,255,255,0.03));
  border-radius:inherit;border-bottom-left-radius:60% 28%;border-bottom-right-radius:60% 28%;
  pointer-events:none;z-index:-1}
.blue{
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1.5px solid rgba(255,255,255,0.62);
  box-shadow:0 8px 20px rgba(14,88,128,0.30),0 2px 5px rgba(15,23,42,0.16),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -10px 16px rgba(255,255,255,0.08)}

/* ---------- header: logo in a glass frame ---------- */
header{text-align:center;padding:22px 16px 6px}
.logo-wrap{display:inline-flex;align-items:center;justify-content:center;position:relative;isolation:isolate;overflow:hidden;
  padding:8px 26px;border-radius:22px;
  background:linear-gradient(120deg,rgba(37,170,225,0.22),rgba(255,255,255,0.55) 45%,rgba(127,182,63,0.22)),rgba(255,255,255,0.6);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  border:1.5px solid rgba(255,255,255,0.95);
  box-shadow:0 0 0 1px rgba(15,23,42,0.08),0 12px 30px rgba(37,150,200,0.28),0 2px 6px rgba(15,23,42,0.12),inset 0 1px 0 #fff,inset 0 -12px 22px rgba(255,255,255,0.45)}
.logo-wrap::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0));border-radius:22px 22px 0 0;pointer-events:none;z-index:0}
.logo-wrap::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:28%;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,0.55),rgba(255,255,255,0));
  transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes shine{0%,55%{left:-40%}100%{left:140%}}
.logo{position:relative;z-index:1;height:64px;width:auto;display:block;filter:drop-shadow(0 2px 3px rgba(15,23,42,0.18))}
.hbadge{display:inline-block;margin-top:12px;padding:5px 18px;border-radius:22px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1.5px solid rgba(255,255,255,0.62);
  box-shadow:0 8px 20px rgba(14,88,128,0.28),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -10px 16px rgba(255,255,255,0.08)}
header .sub{font-size:12px;color:var(--mut);margin-top:8px}

.wrap{max-width:560px;margin:auto;padding:12px 14px 20px}

/* ---------- steps ---------- */
.steps{display:flex;gap:8px;margin-bottom:14px}
.st{flex:1;text-align:center;font-size:12px;padding:9px 4px;border-radius:12px;color:var(--mut);font-weight:600;
  background:linear-gradient(150deg,rgba(255,255,255,0.75),rgba(255,255,255,0.35));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 4px 12px rgba(14,88,128,0.10),inset 0 1px 0 #fff}
.st.on,.st.done{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,0.35);border:1.5px solid rgba(255,255,255,0.62);
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  box-shadow:0 8px 20px rgba(14,88,128,0.30),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -10px 16px rgba(255,255,255,0.08)}
.st.done{background:linear-gradient(150deg,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.04) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,rgba(14,88,128,0.95),rgba(6,58,96,0.92))}

/* ---------- main glass card ---------- */
.card{border-radius:20px;padding:16px;
  background:linear-gradient(150deg,rgba(255,255,255,0.78),rgba(255,255,255,0.46));
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  border:1.5px solid rgba(255,255,255,0.95);
  box-shadow:0 14px 36px rgba(14,88,128,0.16),0 2px 6px rgba(15,23,42,0.08),inset 0 1px 0 #fff}
.lbl{font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.list{display:grid;gap:10px;max-height:60vh;overflow-y:auto;padding:2px;scrollbar-width:thin}

/* ---------- option buttons: glass ---------- */
.opt{
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);border-radius:14px;padding:14px 10px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1.5px solid rgba(255,255,255,0.62);
  box-shadow:0 8px 20px rgba(14,88,128,0.28),0 2px 5px rgba(15,23,42,0.14),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -10px 16px rgba(255,255,255,0.08);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;font-family:inherit}
.opt:hover{transform:translateY(-2px);filter:brightness(1.08) saturate(1.1);box-shadow:0 14px 30px rgba(14,88,128,0.38),0 3px 8px rgba(15,23,42,0.18),inset 0 1.5px 0 rgba(255,255,255,0.85),inset 0 -10px 16px rgba(255,255,255,0.10)}
.opt:active{transform:translateY(0);filter:brightness(0.97)}
.list .opt{text-align:left;padding-left:16px}

/* back (lighter grey-blue glass) */
.back{display:inline-block;margin:0 0 12px;padding:7px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  background:linear-gradient(150deg,rgba(255,255,255,0.26) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,rgba(100,128,160,0.92),rgba(62,86,116,0.90));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1.5px solid rgba(255,255,255,0.62);
  box-shadow:0 6px 16px rgba(62,86,116,0.28),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -8px 14px rgba(255,255,255,0.08);
  transition:transform .18s ease,filter .18s ease}
.back:hover{transform:translateY(-2px);filter:brightness(1.08)}

/* selected tags */
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;color:#0a5480;
  background:linear-gradient(150deg,rgba(37,170,225,0.22),rgba(255,255,255,0.55));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 3px 8px rgba(14,88,128,0.12),inset 0 1px 0 #fff}

/* result */
.res{text-align:center;padding:10px 0 4px}
.res small{color:var(--mut);font-size:13px}
.price{font-size:36px;font-weight:800;margin:6px 0;color:#0a5480;text-shadow:0 2px 8px rgba(37,170,225,0.25)}
.res .m{font-size:16px;font-weight:800}
.all{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.y{border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;color:var(--mut);font-weight:600;
  background:linear-gradient(150deg,rgba(255,255,255,0.8),rgba(255,255,255,0.4));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.95);box-shadow:0 4px 12px rgba(14,88,128,0.10),inset 0 1px 0 #fff}
.y b{display:block;font-size:12px;color:var(--tx)}
.y.cur{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  border:1.5px solid rgba(255,255,255,0.62);box-shadow:0 8px 20px rgba(14,88,128,0.30),inset 0 1.5px 0 rgba(255,255,255,0.75)}
.y.cur b{color:#fff}

/* new search button */
.reset{width:100%;margin-top:16px;padding:13px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);
  background:linear-gradient(150deg,rgba(255,255,255,0.24) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0) 100%),linear-gradient(160deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1.5px solid rgba(255,255,255,0.62);
  box-shadow:0 8px 20px rgba(14,88,128,0.30),inset 0 1.5px 0 rgba(255,255,255,0.75),inset 0 -10px 16px rgba(255,255,255,0.08);
  transition:transform .18s ease,filter .18s ease}
.reset:hover{transform:translateY(-2px);filter:brightness(1.08) saturate(1.1)}

/* search box */
#q{width:100%;padding:12px 16px;border-radius:14px;font-size:16px;margin-bottom:12px;color:var(--tx);outline:none;font-family:inherit;
  background:linear-gradient(150deg,rgba(255,255,255,0.9),rgba(255,255,255,0.6));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.95);box-shadow:0 4px 12px rgba(14,88,128,0.12),inset 0 1px 3px rgba(14,88,128,0.10);
  transition:box-shadow .18s ease,border-color .18s ease}
#q:focus{border-color:rgba(22,118,170,0.8);box-shadow:0 0 0 3px rgba(37,170,225,0.25),0 4px 12px rgba(14,88,128,0.12)}
.note{text-align:center;color:var(--mut);font-size:11px;margin-top:16px}

/* ---------- desktop: wider, fills the screen nicely ---------- */
@media (min-width:768px){
  header{padding-top:34px}
  .logo{height:96px}
  .logo-wrap{padding:10px 34px}
  .wrap{max-width:980px;padding:16px 24px 28px}
  .st{font-size:14px;padding:11px 6px}
  .card{padding:24px}
  .lbl{font-size:15px}
  .grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .list{grid-template-columns:repeat(2,1fr);gap:14px;max-height:56vh}
  .opt{font-size:16px;padding:18px 12px}
  .all{grid-template-columns:repeat(5,1fr);gap:10px}
  .y{font-size:12px;padding:10px 6px}.y b{font-size:14px}
  .price{font-size:52px}
  .res .m{font-size:20px}
  .reset{max-width:420px;display:block;margin-left:auto;margin-right:auto}
}
.res .price{font-size:30px}.vl{font-size:12px;color:var(--mut);margin-top:8px;font-weight:600}
.lease{border-radius:18px;padding:14px;text-align:center;margin-top:10px}
.lease small{font-size:12px;opacity:.9}.lease .amt{font-size:36px;font-weight:800;margin:4px 0}
.lease .meta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.lease .meta span{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.lease.na{color:var(--mut);background:rgba(255,255,255,0.65);border:1.5px solid rgba(255,255,255,0.95);box-shadow:0 4px 12px rgba(14,88,128,0.10)}
.y .ls{display:block;font-size:10px;margin-top:3px;color:#0a5480;font-weight:700}.y.cur .ls{color:#fff}
@media (min-width:768px){.lease .amt{font-size:48px}.res .price{font-size:40px}.y .ls{font-size:11px}}

  }else if(!S.model){steps(2);
    const ms=D.filter(d=>d[0]===S.make);
    box.innerHTML='<button class="back" data-k="back">‹ Back</button>'+tags()+'<div class="lbl">Search / select the model</div><input id="q" type="search" placeholder="Search model… (e.g. pulsar)" autocomplete="off"><div class="list" id="opts"></div>';fill(ms.map(d=>d[1]),'model');
  }else if(!S.year){steps(3);
    const p=D.find(d=>d[0]===S.make&&d[1]===S.model)[2];
    const ys=Object.keys(p).sort((a,b)=>b-a);
    box.innerHTML='<button class="back" data-k="back">‹ Back</button>'+tags()+'<div class="lbl">Select the year</div><div class="grid">'+ys.map(y=>'<button class="opt" data-k="year" data-v="'+y+'">'+y+'</button>').join('')+'</div>';
  }else{steps(5);document.getElementById('s4').className='st on';
    const p=D.find(d=>d[0]===S.make&&d[1]===S.model)[2];
    const ys=Object.keys(p).sort((a,b)=>b-a);
    const ls=lease(S.make,S.model,S.year,p[S.year]);
    const lb=ls?'<div class="lease blue glass"><small>Maximum Leasing Amount</small><div class="amt">'+fmt(ls.amt)+'</div><div class="meta"><span>LTV '+Math.round(ls.ltv*100)+'%</span><span>'+ls.ten+' months</span><span>'+ls.cat+'</span></div></div>':'<div class="lease na"><b>Leasing amount not available</b><br><small>This model is not in the valuation sheet. Please check with the branch.</small></div>';
    box.innerHTML='<button class="back" data-k="back">‹ Back</button><div class="res"><small>'+S.make+'</small><div class="m">'+S.model+'</div><small>Year '+S.year+'</small><div class="vl">Bike value</div><div class="price">'+fmt(p[S.year])+'</div></div>'+lb+'<div class="lbl" style="margin-top:14px">All years</div><div class="all">'+ys.map(y=>{const l=lease(S.make,S.model,y,p[y]);return '<div class="y'+(y===S.year?' cur':'')+'">'+y+'<b>'+fmt(p[y])+'</b><span class="ls">'+(l?'Lease '+fmt(l.amt):'Lease N/A')+'</span></div>'}).join('')+'</div><button class="reset" data-k="reset">New search</button>';
  }
}
box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,v=b.dataset.v;
  if(k==='make')S.make=v;else if(k==='model')S.model=v;else if(k==='year')S.year=v;
  else if(k==='reset')S={make:null,model:null,year:null};
  else if(k==='back'){if(S.year)S.year=null;else if(S.model)S.model=null;else S.make=null}
  render();window.scrollTo(0,0)});
render();
</script></body></html>
